name: eggplant_chat
description: A local-network desktop messenger for macOS and Windows.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shadcn_ui: ^0.57.2
  flutter_quill: ^11.6.0
  vsc_quill_delta_to_html: ^1.0.5
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  path_provider: ^2.1.6
  window_manager: ^0.5.1
  basic_utils: ^5.8.2
  crypto: ^3.0.8
  super_clipboard: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
